name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (GiNZA 込み)
        run: uv sync --all-extras --dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Eval (rules + ner, 合成データ)
        run: uv run python eval/run_eval.py --configs rules_only,rules_ner --output /tmp/eval.md
